<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود / ثبت‌نام | DNS Gaming</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d2a;
            --nav-bg: rgba(15, 23, 42, 0.85);
            --primary: #38bdf8;
            --primary-neon: #00f2fe;
            --accent: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        /* Navbar */
        navbar {
            position: sticky; top: 0; z-index: 1000;
            background: var(--nav-bg); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 30px; display: flex; justify-content: space-between; align-items: center;
        }
        .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-icon { background: linear-gradient(135deg, #00f2fe, #38bdf8); color: #0b0f19; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 1.3rem; }
        .logo-text { font-size: 1.4rem; font-weight: 800; color: var(--primary-neon); }

        .btn-back {
            background: rgba(56, 189, 248, 0.1); border: 1px solid var(--primary); color: var(--primary-neon);
            padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px;
            text-decoration: none;
        }
        .btn-back:hover { background: var(--primary); color: #0b0f19; }

        /* Auth Container */
        .auth-container {
            max-width: 450px; margin: 50px auto; width: 90%; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 20px; padding: 35px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .auth-tabs {
            display: flex; background: rgba(0, 0, 0, 0.2); border-radius: 12px; padding: 5px; margin-bottom: 30px;
        }

        .tab-btn {
            flex: 1; padding: 12px; text-align: center; background: transparent; border: none;
            color: var(--text-muted); font-weight: bold; font-size: 1rem; cursor: pointer; border-radius: 8px;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--primary); color: #0b0f19; box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted); }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .input-wrapper input {
            width: 100%; padding: 12px 42px 12px 14px; background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-main); font-size: 0.95rem;
            outline: none; transition: border-color 0.3s;
        }
        .input-wrapper input:focus { border-color: var(--primary-neon); }

        /* Password Strength Bar */
        .strength-container { margin-top: 10px; }
        .strength-bar-bg { height: 6px; width: 100%; background: rgba(255, 255, 255, 0.1); border-radius: 3px; overflow: hidden; }
        .strength-bar-fill { height: 100%; width: 0%; background: var(--danger); transition: all 0.3s ease; }
        .strength-text { font-size: 0.8rem; margin-top: 6px; color: var(--text-muted); display: flex; justify-content: space-between; }

        /* Requirements Checklist */
        .requirements-list { list-style: none; margin-top: 12px; font-size: 0.82rem; }
        .requirements-list li { color: var(--text-muted); margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        .requirements-list li.valid { color: var(--accent); }
        .requirements-list li.valid i::before { content: "\f00c"; }

        .submit-btn {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #00f2fe, #4facfe);
            border: none; border-radius: 10px; color: #0b0f19; font-weight: bold; font-size: 1rem;
            cursor: pointer; margin-top: 15px; transition: opacity 0.2s;
        }
        .submit-btn:hover { opacity: 0.9; }

        .form-box { display: none; }
        .form-box.active { display: block; }

        footer { background: var(--card-bg); padding: 25px 20px; text-align: center; color: var(--text-muted); margin-top: auto; }
    </style>
</head>
<body>

    <navbar>
        <a href="index.html" class="nav-logo">
            <div class="logo-icon"><i class="fa-solid fa-bolt"></i></div>
            <span class="logo-text">DNS Gaming</span>
        </a>
        <a href="index.html" class="btn-back">
            <i class="fa-solid fa-arrow-right"></i> بازگشت
        </a>
    </navbar>

    <div class="auth-container">
        <div class="auth-tabs">
            <button class="tab-btn active" id="tab-login-btn" onclick="switchTab('login')">ورود</button>
            <button class="tab-btn" id="tab-register-btn" onclick="switchTab('register')">ثبت‌نام</button>
        </div>

        <!-- Login Form -->
        <div class="form-box active" id="login-box">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>ایمیل یا نام کاربری</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" required placeholder="مثال: gamer123">
                    </div>
                </div>

                <div class="form-group">
                    <label>رمز عبور</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" required placeholder="******">
                    </div>
                </div>

                <button type="submit" class="submit-btn">ورود به حساب</button>
            </form>
        </div>

        <!-- Register Form -->
        <div class="form-box" id="register-box">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>نام کاربری</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" required placeholder="انتخاب نام کاربری">
                    </div>
                </div>

                <div class="form-group">
                    <label>ایمیل</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" required placeholder="gamer@example.com">
                    </div>
                </div>

                <div class="form-group">
                    <label>رمز عبور</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="reg-password" oninput="checkPasswordStrength()" required placeholder="رمز عبور">
                    </div>

                    <!-- Strength Indicator -->
                    <div class="strength-container">
                        <div class="strength-bar-bg">
                            <div class="strength-bar-fill" id="strength-bar"></div>
                        </div>
                        <div class="strength-text">
                            <span>قدرت رمز عبور:</span>
                            <strong id="strength-label">خیلی ضعیف</strong>
                        </div>
                    </div>

                    <!-- Checklist -->
                    <ul class="requirements-list">
                        <li id="req-length"><i class="fa-solid fa-circle-xmark"></i> حداقل ۸ کاراکتر</li>
                        <li id="req-lower"><i class="fa-solid fa-circle-xmark"></i> حداقل یک حرف کوچک (a-z)</li>
                        <li id="req-upper"><i class="fa-solid fa-circle-xmark"></i> حداقل یک حرف بزرگ (A-Z)</li>
                        <li id="req-symbol"><i class="fa-solid fa-circle-xmark"></i> حداقل یک نماد/سیمبل (@#$%!&*)</li>
                    </ul>
                </div>

                <button type="submit" class="submit-btn">ایجاد حساب کاربری</button>
            </form>
        </div>
    </div>

    <footer>
        <p>کلیه حقوق محفوظ است © DNS Gaming 2026</p>
    </footer>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-box').forEach(box => box.classList.remove('active'));

            if (tab === 'login') {
                document.getElementById('tab-login-btn').classList.add('active');
                document.getElementById('login-box').classList.add('active');
            } else {
                document.getElementById('tab-register-btn').classList.add('active');
                document.getElementById('register-box').classList.add('active');
            }
        }

        function checkPasswordStrength() {
            const pwd = document.getElementById('reg-password').value;
            const bar = document.getElementById('strength-bar');
            const label = document.getElementById('strength-label');

            const reqLength = pwd.length >= 8;
            const reqLower = /[a-z]/.test(pwd);
            const reqUpper = /[A-Z]/.test(pwd);
            const reqSymbol = /[!@#$%^&*(),.?":{}|<>]/.test(pwd);

            updateChecklistItem('req-length', reqLength);
            updateChecklistItem('req-lower', reqLower);
            updateChecklistItem('req-upper', reqUpper);
            updateChecklistItem('req-symbol', reqSymbol);

            let score = 0;
            if (reqLength) score += 25;
            if (reqLower) score += 25;
            if (reqUpper) score += 25;
            if (reqSymbol) score += 25;

            bar.style.width = score + '%';

            if (score <= 25) {
                bar.style.background = 'var(--danger)';
                label.innerText = 'ضعیف';
                label.style.color = 'var(--danger)';
            } else if (score <= 75) {
                bar.style.background = 'var(--warning)';
                label.innerText = 'متوسط';
                label.style.color = 'var(--warning)';
            } else {
                bar.style.background = 'var(--accent)';
                label.innerText = 'عالی و قوی';
                label.style.color = 'var(--accent)';
            }
        }

        function updateChecklistItem(id, isValid) {
            const item = document.getElementById(id);
            const icon = item.querySelector('i');
            if (isValid) {
                item.classList.add('valid');
                icon.className = 'fa-solid fa-circle-check';
            } else {
                item.classList.remove('valid');
                icon.className = 'fa-solid fa-circle-xmark';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            alert('درخواست ورود به بک‌اند PHP ارسال می‌شود...');
        }

        function handleRegister(e) {
            e.preventDefault();
            const pwd = document.getElementById('reg-password').value;
            if (pwd.length < 8 || !/[a-z]/.test(pwd) || !/[A-Z]/.test(pwd) || !/[!@#$%^&*(),.?":{}|<>]/.test(pwd)) {
                alert('لطفاً تمامی شرایط رمز عبور را رعایت کنید.');
                return;
            }
            alert('ثبت‌نام با موفقیت انجام شد!');
        }
    </script>
</body>
</html>
